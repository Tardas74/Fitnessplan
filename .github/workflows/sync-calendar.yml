name: Sync Calendar

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ICS from Google Calendar
        run: |
          curl -sL "https://calendar.google.com/calendar/ical/c0s9epsmpe5c4mg91v7ksuldnk%40group.calendar.google.com/private-0b609aa423dd0e95fb32e2d4da3374e5/basic.ics" -o calendar.ics
          test -s calendar.ics

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git diff --staged --quiet || git commit -m "Sync calendar.ics"
          git push

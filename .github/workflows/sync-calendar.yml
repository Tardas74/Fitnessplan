name: Sync Calendar

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ICS from Google Calendar
        run: |
          curl -sL "https://calendar.google.com/calendar/ical/3a46af0781af4e47e8e0767ef7a3e645fb2306b4e31d457855ba6085ff7ba5c0%40group.calendar.google.com/private-79031cd9fcb39750b9d514889e24d2ec/basic.ics" -o calendar.ics
          test -s calendar.ics

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git diff --staged --quiet || git commit -m "Sync calendar.ics"
          git push
